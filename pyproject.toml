[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-reasoning"
version = "0.1.0"
description = "Auditable Qwen3-4B puzzle-reasoning SFT case study"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
train = ["torch==2.6.0", "transformers==4.57.6", "trl==0.27.2", "peft==0.20.0", "accelerate==1.14.0", "bitsandbytes==0.50.0", "datasets==5.0.1"]

[project.scripts]
qwen-reasoning-score = "qwen_reasoning.score:main"
qwen-reasoning-train = "qwen_reasoning.train_sft:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
